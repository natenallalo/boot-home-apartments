<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מאתר דירות — רמלה ולוד</title>
  <style>
    :root {
      --bg0: #0b1220;
      --bg1: #121a2b;
      --card: #182338;
      --line: #2a3a55;
      --text: #e8eef9;
      --muted: #94a3b8;
      --accent: #2dd4bf;
      --accent2: #38bdf8;
      --input: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(45, 212, 191, 0.18), transparent 55%),
        radial-gradient(900px 500px at -10% 20%, rgba(56, 189, 248, 0.14), transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.55rem, 4vw, 2.1rem);
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 1.1rem;
      margin-top: 1.25rem;
      align-items: start;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }
    .filters {
      background: color-mix(in srgb, var(--card) 94%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem;
      position: sticky;
      top: 0.75rem;
    }
    .filters h2 { margin: 0 0 0.85rem; font-size: 1.05rem; }
    .filters h3 {
      margin: 0.95rem 0 0.55rem;
      font-size: 0.92rem;
      color: var(--accent);
      font-weight: 700;
    }
    label.field {
      display: block;
      margin-bottom: 0.65rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    label.field > span { display: block; margin-bottom: 0.28rem; color: var(--text); }
    input[type="text"], input[type="number"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      font-size: 0.95rem;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    .check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.45rem 0;
      font-size: 0.92rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .check input {
      accent-color: var(--accent);
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 0.2rem 0 0.6rem; }
    .actions { display: grid; gap: 0.45rem; margin-top: 0.85rem; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--accent); color: #042f2e; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 0.55rem;
      margin-bottom: 0.9rem;
    }
    .chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .chip strong { color: var(--accent); font-weight: 700; }
    .listing {
      background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .listing h2 {
      margin: 0 0 0.45rem;
      font-size: 1.08rem;
      line-height: 1.35;
    }
    .listing a { color: var(--accent2); text-decoration: none; }
    .listing a:hover { text-decoration: underline; }
    .row { color: var(--muted); font-size: 0.93rem; margin-bottom: 0.5rem; }
    .summary { margin: 0.35rem 0 0.65rem; line-height: 1.5; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
    .badge {
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.18rem 0.5rem;
      border: 1px solid transparent;
    }
    .b-source { background: rgba(56,189,248,0.12); color: #7dd3fc; border-color: rgba(56,189,248,0.25); }
    .b-private { background: rgba(74,222,128,0.12); color: #86efac; border-color: rgba(74,222,128,0.25); }
    .b-realtor { background: rgba(248,113,113,0.12); color: #fca5a5; border-color: rgba(248,113,113,0.25); }
    .b-type { background: rgba(45,212,191,0.12); color: #5eead4; border-color: rgba(45,212,191,0.25); }
    .b-fav { background: rgba(251,191,36,0.14); color: #fcd34d; border-color: rgba(251,191,36,0.28); }
    .empty, .error {
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 1.4rem;
      color: var(--muted);
      text-align: center;
    }
    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>מאתר דירות — רמלה ולוד</h1>
      <p>סינון חיפוש מלא · מתעדכן מהענן גם כשהמחשב כבוי</p>
    </header>

    <div class="layout">
      <form class="filters" id="filterForm" autocomplete="off">
        <h2>פילטרים</h2>

        <label class="check"><input type="checkbox" name="focusRegion" checked /> מיקוד רמלה + לוד בלבד</label>

        <label class="field">
          <span>עיר / מילת מפתח</span>
          <input type="text" name="cityKeyword" placeholder="רמלה לוד / דירה ברמלה..." />
        </label>
        <p class="hint">0 במחיר/חדרים/קומה = ללא הגבלה. הסינון מתעדכן מיד.</p>

        <h3>סוג נכס</h3>
        <label class="check"><input type="checkbox" name="includeApartments" checked /> דירות</label>
        <label class="check"><input type="checkbox" name="includeUnits" checked /> יחידות דיור</label>
        <label class="check"><input type="checkbox" name="groundFloorOnly" /> קומת קרקע / דירת גן בלבד</label>

        <h3>מחיר</h3>
        <div class="grid2">
          <label class="field"><span>מינ׳</span><input type="number" name="minPrice" min="0" step="100" value="0" /></label>
          <label class="field"><span>מקס׳</span><input type="number" name="maxPrice" min="0" step="100" value="3500" /></label>
        </div>

        <h3>חדרים</h3>
        <div class="grid2">
          <label class="field"><span>מינ׳ (לדירות)</span><input type="number" name="minRooms" min="0" step="0.5" value="3" /></label>
          <label class="field"><span>מקס׳</span><input type="number" name="maxRooms" min="0" step="0.5" value="0" /></label>
        </div>
        <p class="hint">יחידות דיור מוצגות גם עם פחות חדרים.</p>

        <h3>קומה</h3>
        <div class="grid2">
          <label class="field"><span>מינ׳</span><input type="number" name="minFloor" min="0" step="1" value="0" /></label>
          <label class="field"><span>מקס׳</span><input type="number" name="maxFloor" min="0" step="1" value="0" /></label>
        </div>

        <h3>נוסף</h3>
        <label class="check"><input type="checkbox" name="privateOnly" /> ללא תיווך בלבד (פרטי)</label>
        <label class="check"><input type="checkbox" name="favoritesOnly" /> מועדפים בלבד</label>

        <div class="actions">
          <button class="btn-primary" type="submit">החל סינון</button>
          <button class="btn-ghost" type="button" id="resetBtn">אפס לברירת מחדל</button>
        </div>
      </form>

      <main>
        <div class="meta" id="meta"></div>
        <div id="list"><div class="empty">טוען מודעות…</div></div>
      </main>
    </div>

    <footer>הנתונים מתעדכנים אוטומטית כל שעה מהענן · הסינון רץ בדפדפן מיד</footer>
  </div>

  <script>
    const FOCUS_CITIES = ["רמלה", "לוד"];
    const COMMERCIAL = ["חנות", "משרד", "מחסן", "גלריה", "עסק"];
    let ALL = [];
    let DEFAULTS = {};
    let GENERATED_AT = "";

    const form = document.getElementById("filterForm");
    const listEl = document.getElementById("list");
    const metaEl = document.getElementById("meta");

    const ils = (n) => (n == null || n === "") ? "—" : Number(n).toLocaleString("he-IL") + " ₪";
    const roomsTxt = (n) => (n == null || n === "") ? "—" : n;
    const floorTxt = (n) => (n == null || n === "") ? "—" : (Number(n) === 0 ? "קרקע" : n);
    const chip = (label, value) => `<span class="chip">${label}: <strong>${value}</strong></span>`;
    const toNum = (v) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    };

    function readFilters() {
      const fd = new FormData(form);
      const on = (name) => form.elements[name] && form.elements[name].checked;
      return {
        focusRegion: on("focusRegion"),
        cityKeyword: String(fd.get("cityKeyword") || "").trim(),
        includeApartments: on("includeApartments"),
        includeUnits: on("includeUnits"),
        groundFloorOnly: on("groundFloorOnly"),
        minPrice: toNum(fd.get("minPrice")),
        maxPrice: toNum(fd.get("maxPrice")),
        minRooms: toNum(fd.get("minRooms")),
        maxRooms: toNum(fd.get("maxRooms")),
        minFloor: toNum(fd.get("minFloor")),
        maxFloor: toNum(fd.get("maxFloor")),
        privateOnly: on("privateOnly"),
        favoritesOnly: on("favoritesOnly"),
      };
    }

    function applyDefaults(d) {
      DEFAULTS = d || {};
      const el = form.elements;
      el.focusRegion.checked = DEFAULTS.focus_region !== false;
      el.cityKeyword.value = DEFAULTS.city_keyword || "רמלה לוד";
      el.includeApartments.checked = DEFAULTS.include_apartments !== false;
      el.includeUnits.checked = DEFAULTS.include_units !== false;
      el.groundFloorOnly.checked = !!DEFAULTS.ground_floor_only;
      el.minPrice.value = DEFAULTS.min_price ?? 0;
      el.maxPrice.value = DEFAULTS.max_price ?? 3500;
      el.minRooms.value = DEFAULTS.min_rooms ?? 3;
      el.maxRooms.value = DEFAULTS.max_rooms ?? 0;
      el.minFloor.value = DEFAULTS.min_floor ?? 0;
      el.maxFloor.value = DEFAULTS.max_floor ?? 0;
      el.privateOnly.checked = !!DEFAULTS.private_only;
      el.favoritesOnly.checked = !!DEFAULTS.favorites_only;
    }

    function blobOf(item) {
      return `${item.title || ""} ${item.description || ""} ${item.summary || ""} ${item.property_type || ""}`;
    }

    function isUnit(item) {
      if (item.is_unit) return true;
      const b = blobOf(item);
      return (item.property_type || "") === "יחידת דיור" || b.includes("יחידת דיור") || b.includes("יחידה");
    }

    function isCommercial(item) {
      const b = blobOf(item);
      return COMMERCIAL.some((w) => b.includes(w));
    }

    function isSaleAd(item) {
      const b = blobOf(item);
      return b.includes("למכירה") && !b.includes("להשכרה");
    }

    function isGround(item) {
      if (item.floor === 0 || item.is_garden) return true;
      const b = blobOf(item);
      return b.includes("קרקע") || b.includes("דירת גן") || (item.property_type || "") === "דירת גן";
    }

    function matchesCity(item, f) {
      const cityField = (item.city || "").trim();
      const hay = `${item.city || ""} ${item.neighborhood || ""} ${item.title || ""} ${item.description || ""} ${item.summary || ""}`;
      const inFocus = (text) => FOCUS_CITIES.some((c) => (text || "").includes(c));

      if (f.focusRegion) {
        if (cityField && !inFocus(cityField) && !inFocus(hay)) return false;
        if (cityField && !inFocus(cityField) && inFocus(hay)) {
          // Wrong city label but text mentions Ramla/Lod — keep
          return true;
        }
        if (cityField && !inFocus(cityField)) return false;
        return inFocus(cityField) || inFocus(hay);
      }

      const tokens = (f.cityKeyword || "").split(/[\s,;/|]+/).map((t) => t.trim()).filter((t) => t.length >= 2);
      if (!tokens.length) return true;
      return tokens.every((t) => hay.includes(t));
    }

    function passesType(item, f) {
      if (!f.includeApartments && !f.includeUnits) return false;
      if (isCommercial(item)) return false;
      const unit = isUnit(item);
      if (unit) return f.includeUnits;
      return f.includeApartments;
    }

    function passesPrice(item, f) {
      // Match SQLite bot: when min/max set, price must be present.
      if (f.minPrice > 0) {
        if (item.price == null || item.price < f.minPrice) return false;
      }
      if (f.maxPrice > 0) {
        if (item.price == null || item.price > f.maxPrice) return false;
      }
      return true;
    }

    function passesRooms(item, f) {
      const unit = isUnit(item);
      if (f.maxRooms > 0) {
        if (item.rooms != null && item.rooms > f.maxRooms) return false;
      }
      if (f.minRooms > 0) {
        if (unit && f.includeUnits) return true; // flexible for units
        if (item.rooms == null || item.rooms < f.minRooms) return false;
      }
      return true;
    }

    function passesFloor(item, f) {
      if (f.groundFloorOnly && !isGround(item)) return false;
      if (item.floor == null) return true; // unknown floor allowed like the bot
      if (f.minFloor > 0 && item.floor < f.minFloor) return false;
      if (f.maxFloor > 0 && item.floor > f.maxFloor) return false;
      return true;
    }

    function filterListings(f) {
      return ALL.filter((item) => {
        if (isSaleAd(item)) return false;
        if (f.favoritesOnly && !item.is_favorite) return false;
        if (f.privateOnly && item.is_realtor) return false;
        if (!matchesCity(item, f)) return false;
        if (!passesType(item, f)) return false;
        if (!passesPrice(item, f)) return false;
        if (!passesRooms(item, f)) return false;
        if (!passesFloor(item, f)) return false;
        return true;
      });
    }

    function card(item) {
      const loc = [item.city, item.neighborhood].filter(Boolean).join(" · ");
      const badges = [
        item.is_favorite ? `<span class="badge b-fav">★ מועדף</span>` : "",
        item.source ? `<span class="badge b-source">${escapeHtml(item.source)}</span>` : "",
        item.property_type ? `<span class="badge b-type">${escapeHtml(item.property_type)}</span>` : "",
        item.is_realtor
          ? `<span class="badge b-realtor">תיווך</span>`
          : `<span class="badge b-private">פרטי</span>`,
      ].join("");
      const href = item.url
        ? `<a href="${escapeAttr(item.url)}" target="_blank" rel="noopener">למודעה המקורית ←</a>`
        : "";
      return `
        <article class="listing">
          <div class="badges">${badges}</div>
          <h2>${escapeHtml(item.title || "ללא כותרת")}</h2>
          <div class="row">${escapeHtml(loc || "מיקום לא צוין")} · ${ils(item.price)} · ${roomsTxt(item.rooms)} חדרים · קומה ${floorTxt(item.floor)}</div>
          ${item.summary ? `<p class="summary">${escapeHtml(item.summary)}</p>` : ""}
          ${href}
        </article>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function render() {
      const f = readFilters();
      const items = filterListings(f);
      const when = GENERATED_AT
        ? new Date(GENERATED_AT).toLocaleString("he-IL")
        : "לא ידוע";
      metaEl.innerHTML = [
        chip("מוצגות", items.length),
        chip("במסד", ALL.length),
        chip("עודכן", when),
      ].join("");
      listEl.innerHTML = items.length
        ? items.map(card).join("")
        : `<div class="empty">אין מודעות לפי הסינון. נסו להעלות מחיר מקס׳, להוריד חדרים מינ׳, או לכבות מיקוד.</div>`;
    }

    async function load() {
      try {
        const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        ALL = Array.isArray(data.listings) ? data.listings : [];
        GENERATED_AT = data.generated_at || "";
        applyDefaults(data.defaults || {});
        render();
      } catch (err) {
        listEl.innerHTML = `<div class="error">לא הצלחתי לטעון נתונים (${escapeHtml(err.message)}).</div>`;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      render();
    });
    form.addEventListener("input", render);
    form.addEventListener("change", render);
    document.getElementById("resetBtn").addEventListener("click", () => {
      applyDefaults(DEFAULTS);
      render();
    });

    load();
  </script>
</body>
</html>
