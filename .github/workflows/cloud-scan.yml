name: Cloud Apartment Scan

on:
  schedule:
    # Every 30 minutes — denser Facebook coverage + faster alerts
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "settings.json"
      - "worker.py"
      - "scraper.py"
      - "notify.py"
      - "match_filter.py"
      - "settings_store.py"
      - ".github/workflows/cloud-scan.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud scanner
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python worker.py

      - name: Commit updated database
        run: |
          git config user.name "apartment-bot"
          git config user.email "apartment-bot@users.noreply.github.com"
          git add apartments.db scan_status.json settings.json docs/data.json docs/index.html || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "chore: cloud scan update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase origin master && git push && break
              echo "Push conflict, retry $i"
              sleep 5
            done
          fi
